apiVersion: groot.koronet.com/v1alpha1
kind: GrootApp
metadata:
    annotations:
        groot.koronet.com/description: TX Dashboard — Chapter TX wholesaler portfolio
        groot.koronet.com/labs-template: static-site
    labels:
        groot.koronet.com/lane: labs
        groot.koronet.com/product: labs
        groot.koronet.com/tier: tier-4-low
    name: tx-dashboard
spec:
    cells:
        - default: true
          deployments:
            - workload: api
          environment: production
          name: labs
          routes:
            - access:
                policyRef: tx-dashboard-labs
                provider: cloudflare-access
              host: tx-dashboard.koronetlabs.com
              name: web
              port: http
              visibility: edge-protected
              workload: api
          target: koronet-labs-us-east-1
    workloads:
        - name: api
          type: api
